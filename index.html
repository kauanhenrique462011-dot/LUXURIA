<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Arena Shooter 3D - Silent Aim</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Verdana,Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#o{pointer-events:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 12px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000}

#hp{height:100%;width:100%;background:var(--ok);transition:width .15s}
#info{margin-left:auto;text-align:right}
#hf{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;transition:opacity .25s}
.b{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--pn);color:var(--fg);border:1px solid var(--ln);font:inherit}
#wb{left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;font-size:14px}
#fb{right:22px;width:84px;height:84px;border-radius:50%;background:#e5484dcc;border:2px solid #fff6;font-weight:bold;font-size:13px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}
#fb:active{background:#ff6b6b}
#jb{right:120px;width:64px;height:64px;border-radius:50%;font-size:11px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px}

.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:5}
.ov.on{display:flex}
.box{width:min(86vw,320px);background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;max-height:calc(100vh - 16px);overflow-y:auto;touch-action:pan-y}
.box h2{margin:0 0 12px;font-size:18px}
.box input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font-size:16px;user-select:text;-webkit-user-select:text}
.box button{width:100%;margin-top:10px;padding:12px;border-radius:8px;border:0;background:var(--ac);color:#1a1300;font-weight:bold;font-size:15px}
.box button.g{background:transparent;color:var(--fg);border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.box input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--ac);height:28px}
.sw{width:46px!important;height:26px;border-radius:13px!important;background:#444b40!important;position:relative;border:0;padding:0!important;margin:0!important}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)!important}.sw.on::after{left:23px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
#rot{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}

</head>

  </div>

  <div id="contentReg" style="display:none;">

    <div class="row" style="padding:4px 0;font-size:11px;margin-top:4px;"><span>SPIN BOT</span><button class="sw" id="sSpin"></button></div>
    <div class="row" style="padding:4px 0;font-size:11px;"><span>MUNIÇÃO INFINITA</span><button class="sw" id="sInf"></button></div>

  </div>
  <button id="cl2" style="margin-top:8px;padding:8px;font-size:11px;">Voltar ao jogo</button>
</div></div>

function switchTab(active){

        const isAct = t === active;
        $('content'+t).style.display = isAct ? 'block' : 'none';
        const btn = $('tab'+t);
        btn.style.background = isAct ? 'var(--ac)' : '#263322';
        btn.style.color = isAct ? '#1a1300' : 'var(--fg)';
        btn.style.border = isAct ? '0' : '1px solid var(--ln)';
    });
}

$('speedS').oninput=e=>{speedMult=+e.target.value;$('speedV').textContent=speedMult.toFixed(1)+'x'};
$('sFly').onclick=e=>{fly=!fly;e.currentTarget.classList.toggle('on',fly);$('db').style.display=fly?'block':'none';$('jb').innerHTML=fly?'<span>⬆️</span><span>SUBIR</span>':'<span><span>⬆️</span><span>PULAR</span>';rising=false;descending=false;if(!fly&&P&&P.y>0)P.vy=0};
$('sInf').onclick=e=>{infAmmo=!infAmmo;e.currentTarget.classList.toggle('on',infAmmo)};
let tpI=-1;
$('btnTp').onclick=()=>{if(!bots.length){toast('Sem inimigos');return}
 tpI=(tpI+1)%bots.length;const b=bots[tpI],a0=Math.atan2(P.x-b.x,P.z-b.z);let ok=false;
 for(let i=0;i<12&&!ok;i++){const a=a0+i*Math.PI/6,nx=b.x+Math.sin(a)*3,nzz=b.z+Math.cos(a)*3;if(!hitW(nx,nzz,.5,P.y)){P.x=nx;P.z=nzz;ok=true}}
 if(!ok){toast('Sem espaço livre');return}
 P.vx=P.vz=0;P.px=P.x;P.pz=P.z;yaw=Math.atan2(-(b.x-P.x),-(b.z-P.z));pitch=.05;toast('Teleportado');playSound('jump')};
$('rs').onclick=reset;

let pk=[],hm=0,infAmmo=false;
function toast(t){const e=$('tt');e.textContent=t;e.style.opacity=1;clearTimeout(e.h);e.h=setTimeout(()=>e.style.opacity=0,1400)}
function drop(x,z){const t=Math.random();if(t>.55)return;const hl=t<.3,m=new THREE.Mesh(new THREE.BoxGeometry(.5,.5,.5),new THREE.MeshStandardMaterial({color:hl?0x2fbf5a:0xe8a317,emissive:hl?0x0b3d1a:0x4a3300,roughness:.5}));m.position.set(x,.6,z);m.castShadow=true;scene.add(m);pk.push({m,hl,x,z,t:0})}
const DG=new THREE.CircleGeometry(.09,8),DM=new THREE.MeshBasicMaterial({color:0x111111,transparent:true,opacity:.75,polygonOffset:true,polygonOffsetFactor:-4,depthWrite:false}),dec=[];
function decal(h){if(!h.face)return;const n=h.face.normal.clone().transformDirection(h.object.matrixWorld),m=new THREE.Mesh(DG,DM);m.position.copy(h.point).addScaledVector(n,.02);m.lookAt(h.point.clone().add(n));scene.add(m);dec.push(m);if(dec.length>60)scene.remove(dec.shift())}
function flashBot(b){const f=e=>b.mesh.traverse(m=>{if(m.material&&m.material.emissive)m.material.emissive.setHex(e)});f(0x771111);setTimeout(()=>f(0),90)}
let pt=[],shake=0;const PG=new THREE.BoxGeometry(.08,.08,.08),MC={};
function spark(p,c,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(PG,MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.4})));m.position.copy(p);scene.add(m);pt.push({m,vx:(Math.random()-.5)*5,vy:Math.random()*5,vz:(Math.random()-.5)*5,t:.8})}}
const FT=(()=>{const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d'),g=x.createRadialGradient(32,32,2,32,32,32);g.addColorStop(0,'rgba(255,250,200,1)');g.addColorStop(.4,'rgba(255,190,60,.7)');g.addColorStop(1,'rgba(255,120,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(k)})();
function flash(p){P.mesh.userData.aim=.5;const m=new THREE.Sprite(new THREE.SpriteMaterial({map:FT,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));m.scale.setScalar(.9+Math.random()*.5);m.position.copy(p);scene.add(m);tr.push({l:m,t:.05})}
const TUP=V3(0,1,0);
function tracer(a,b,c){const d=b.clone().sub(a),len=d.length();if(len<.1)return;const l=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,len,5),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));l.position.copy(a).addScaledVector(d,.5);l.quaternion.setFromUnitVectors(TUP,d.normalize());scene.add(l);tr.push({l,t:.08})}
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const Lv=()=>V3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
function setCam(dt){
 const targetFov = isAiming ? 32 : 65;
 cam.fov += (targetFov - cam.fov) * Math.min(1, dt * 12);
 cam.updateProjectionMatrix();

 const L=Lv(),t=V3(P.x,1.7+P.y,P.z),r=V3(Math.cos(yaw),0,-Math.sin(yaw));
 cam.position.copy(t).addScaledVector(L,-5).addScaledVector(r,.8);cam.position.y=Math.max(.5,cam.position.y);if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-.02)}
 cam.lookAt(cam.position.clone().add(L));
 sun.position.set(Math.round(P.x)+35,60,Math.round(P.z)+25);
 sun.target.position.set(Math.round(P.x),0,Math.round(P.z))}

function shoot(){const w=WEAP[wi],eye=V3(P.x,1.6+P.y,P.z),L=Lv(),muz=V3(P.x,1.3+P.y,P.z).addScaledVector(L,.8);
 playSound('shoot');
 const tg=[...bots.map(b=>b.mesh),...wm];
 for(let i=0;i<w.p;i++){let o=cam.position.clone(),d=L.clone();
  if(silentAim && bots.length > 0){
      let nearest = bots[0], minDist = Math.hypot(nearest.x - P.x, nearest.z - P.z);
      for(const b of bots){let dist = Math.hypot(b.x - P.x, b.z - P.z); if(dist < minDist){minDist = dist; nearest = b;}}
      if(nearest){ o = eye; d = V3(nearest.x, 1.7, nearest.z).sub(eye).normalize(); }
  } else if(aimT){ o = eye; d = V3(aimT.x,1.7,aimT.z).sub(eye).normalize(); }
  
  d.x+=(Math.random()-.5)*w.sp*2;d.y+=(Math.random()-.5)*w.sp*2;d.z+=(Math.random()-.5)*w.sp*2;d.normalize();
  rc.set(o,d);rc.far=150;const h=rc.intersectObjects(tg,true);let end=o.clone().addScaledVector(d,100);
  if(h.length){end=h[0].point;const b=h[0].object.userData.bot;if(b){b.hp-=w.d*(h[0].object.userData.head?2:1);b.kx=(b.kx||0)+d.x*w.d*.25;b.kz=(b.kz||0)+d.z*w.d*.25;spark(end,0xc02020,8);hm=.18;flashBot(b);playSound(h[0].object.userData.head?'head':'hit')}else{spark(end,0xffd25a,4);decal(h[0]);playSound('ric',end.x,end.z)}}
  tracer(muz,end,0xffd25a)}
 flash(muz);pitch=Math.min(.7,pitch+(w.p>1?.05:.012));yaw+=(Math.random()-.5)*.006}

function sep(){const a=[P,...bots];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){if(i===0&&P.y>1.2)continue;const dx=a[j].x-a[i].x,dz=a[j].z-a[i].z,d=Math.hypot(dx,dz);if(d<1&&d>.001){const k=(1-d)/2,ux=dx/d,uz=dz/d;mvE(a[i],-ux*k,-uz*k,.5);mvE(a[j],ux*k,uz*k,.5)}}}
function upd(dt){
 let mx=0,my=0;if(ms)[mx,my]=sv(ms);
 if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
 if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
 const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
 const f=-my,s=Math.sin(yaw),c=Math.cos(yaw);
 const gk=P.y>.05?3:12;const sm=speedBoost?speedMult:1;P.vx+=((-s*f+c*mx)*7*sm-P.vx)*Math.min(1,gk*dt);P.vz+=((-c*f-s*mx)*7*sm-P.vz)*Math.min(1,gk*dt);mvE(P,P.vx*dt,P.vz*dt,.5);

 aimT=null;
 if(aimbot){let bd=1e9;const eye=V3(P.x,1.6+P.y,P.z);for(const b of bots){if(Math.hypot(b.x-P.x,b.z-P.z)>70)continue;const q=V3(b.x,1.7,b.z).project(cam);if(q.z>1)continue;const sd=Math.hypot(q.x*.5*W,q.y*.5*H);if(sd<=fovR&&sd<bd&&clear(eye,V3(b.x,1.7,b.z))){bd=sd;aimT=b}}
  if(aimT){const v=V3(aimT.x,1.7,aimT.z).sub(eye),l=v.length(),k=Math.min(1,dt*14);
   yaw+=wrap(Math.atan2(-v.x,-v.z)-yaw)*k;pitch+=(Math.asin(v.y/l)-pitch)*k}}
 const fl=gh(P.x,P.z,P.y);
  if(fly){const up=rising||keys.Space,down=descending||keys.ControlLeft||keys.ControlRight;P.vy=up&&!down?7:down&&!up?-7:0;P.y=Math.max(fl,Math.min(24,P.y+P.vy*dt));jump=false}
  else{if((jump||keys.Space)&&P.y<=fl+.02){P.vy=8.5;playSound('jump')}jump=false;P.vy-=25*dt;P.y+=P.vy*dt;if(P.y<fl){if(P.vy<-5)playSound('land');P.y=fl;P.vy=0}}
 sep();
 spA+=dt*14;P.mesh.position.set(P.x,P.y,P.z);P.mesh.rotation.y=spin?spA:yaw;
 const ps=Math.hypot(P.x-P.px,P.z-P.pz)/Math.max(dt,.001);P.px=P.x;P.pz=P.z;anim(P.mesh,P.y>.05?0:Math.min(1,ps/5)*(ps>.6?1:0),dt);
 stepT-=dt;if(ps>1.5&&P.y<=.05&&stepT<=0){playSound('step');stepT=Math.max(.2,2.6/ps)}

 cdT-=dt;const wp=WEAP[wi],wantF=firing||mouse.down&&locked()||keys.KeyF||aimT||(silentAim&&bots.some(b=>Math.hypot(b.x-P.x,b.z-P.z)<70));
 if(rl>0){rl-=dt;if(rl<=0){mag[wi]=wp.mg;playSound('reloadEnd');toast('Recarregada')}}
 else if(keys.KeyR&&mag[wi]<wp.mg&&!infAmmo){rl=wp.rt;playSound('reload')}
 else if(wantF&&cdT<=0){if(infAmmo||mag[wi]>0){shoot();if(!infAmmo)mag[wi]--;cdT=wp.cd}else{rl=wp.rt;playSound('reload')}}

 const pe=V3(P.x,1.5+P.y,P.z);
 for(const b of bots){const dx=P.x-b.x,dz=P.z-b.z,d=Math.hypot(dx,dz),see=d<45&&clear(V3(b.x,1.7,b.z),pe);
  if(see){b.mesh.rotation.y=Math.atan2(-dx,-dz);if(d>14)mvE(b,dx/d*2.8*dt,dz/d*2.8*dt,.5);
   b.cd-=dt;if(b.cd<=0){b.cd=1.2+Math.random()*.8;const hit=Math.random()<.25,e=pe.clone();if(!hit){e.x+=(Math.random()-.5)*5;e.y+=(Math.random()-.5)*2.5}
    b.mesh.userData.aim=.5;playSound('bot',b.x,b.z);if(!hit)playSound('whiz',e.x,e.z);tracer(V3(b.x,1.3,b.z),e,0xff6b6b);if(hit){P.hp-=6;shake=.15;playSound('hurt');$('hf').style.opacity=.3;setTimeout(()=>$('hf').style.opacity=0,100)}}}
  else{b.t-=dt;if(b.t<=0||Math.hypot(b.tx-b.x,b.tz-b.z)<1){b.tx=Math.max(-HW+3,Math.min(HW-3,b.x+(Math.random()-.5)*30));b.tz=Math.max(-HW+3,Math.min(HW-3,b.z+(Math.random()-.5)*30));b.t=4}
   const ex=b.tx-b.x,ez=b.tz-b.z,l=Math.hypot(ex,ez)||1;b.mesh.rotation.y=Math.atan2(-ex,-ez);mvE(b,ex/l*2*dt,ez/l*2*dt,.5)}
  if(b.kx||b.kz){mvE(b,b.kx*dt,b.kz*dt,.5);const kk=Math.exp(-8*dt);b.kx*=kk;b.kz*=kk}const bs=Math.hypot(b.x-(b.px??b.x),b.z-(b.pz??b.z))/Math.max(dt,.001);anim(b.mesh,Math.min(1,bs/3)*(bs>.6?1:0),dt);b.px=b.x;b.pz=b.z;b.mesh.position.set(b.x,0,b.z)}
 const n=bots.length;bots=bots.filter(b=>{if(b.hp>0)return true;b.dt=0;spark(V3(b.x,1.2,b.z),0xc02020,14);drop(b.x,b.z);playSound('kill',b.x,b.z);dead.push(b);return false});kills+=n-bots.length;
 dead=dead.filter(b=>{b.dt+=dt;b.mesh.rotation.x=Math.min(1.5,b.dt*4);anim(b.mesh,0,dt);if(b.dt>1.6){scene.remove(b.mesh);return false}return true});
 if(!bots.length)next();
 pt=pt.filter(p=>{p.t-=dt;p.vy-=18*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;if(p.m.position.y<.05){p.m.position.y=.05;p.vy*=-.4;p.vx*=.6;p.vz*=.6}if(p.t<=0){scene.remove(p.m);return false}return true});
 tr=tr.filter(t=>{t.t-=dt;if(t.t<=0){scene.remove(t.l);if(!t.l.isSprite)t.l.geometry.dispose();t.l.material.dispose();return false}return true});
 if(P.hp<=0&&!over){over=true;playSound('over');$('gs').textContent='Abates: '+kills+' | Onda: '+wave;$('go').classList.add('on')}
 $('wb').textContent=WEAP[wi].n+' '+(infAmmo?'∞':rl>0?'recarregando...':mag[wi]+'/'+WEAP[wi].mg);
 pk=pk.filter(p=>{p.t+=dt;p.m.rotation.y+=dt*2;p.m.position.y=.6+Math.sin(p.t*3)*.12;if(Math.hypot(P.x-p.x,P.z-p.z)<1.3&&P.y<1.3){if(p.hl)P.hp=Math.min(100,P.hp+35);else WEAP.forEach((w,i)=>mag[i]=w.mg);toast(p.hl?'+35 vida':'Munição cheia');playSound('pick');scene.remove(p.m);return false}return true});
 $('hp').style.width=Math.max(0,P.hp)+'%';$('hp').style.background=P.hp>40?'var(--ok)':'var(--bad)';$('vg2').style.opacity=P.hp<35?Math.min(1,(35-P.hp)/25):0;hbT-=dt;if(P.hp>0&&P.hp<35&&hbT<=0){playSound('beat');hbT=.45+P.hp/70}
 $('info').textContent='Abates '+kills+'  Onda '+wave+'  Inimigos '+bots.length;
}

function hud(){oc.clearRect(0,0,W,H);
 {const rx=70,ry=84,rr=56,rs=rr/32,sn=Math.sin(yaw),cs=Math.cos(yaw);oc.fillStyle='#0008';oc.beginPath();oc.arc(rx,ry,rr,0,7);oc.fill();oc.strokeStyle='#ffffff44';oc.lineWidth=1.5;oc.stroke();
 const dt2=(x,z,c)=>{const dx=x-P.x,dz=z-P.z,u=dx*cs-dz*sn,v=dx*sn+dz*cs;if(Math.hypot(u,v)>32)return;oc.fillStyle=c;oc.beginPath();oc.arc(rx+u*rs,ry+v*rs,3,0,7);oc.fill()};
 for(const p of pk)dt2(p.x,p.z,p.hl?'#46c26b':'#e8a317');for(const b of bots)dt2(b.x,b.z,'#ff4d4d');
 oc.fillStyle='#4aa3ff';oc.beginPath();oc.moveTo(rx,ry-7);oc.lineTo(rx-5,ry+5);oc.lineTo(rx+5,ry+5);oc.fill()}
 oc.strokeStyle='#fff';oc.lineWidth=2;oc.beginPath();oc.moveTo(W/2-10,H/2);oc.lineTo(W/2-3,H/2);oc.moveTo(W/2+3,H/2);oc.lineTo(W/2+10,H/2);oc.moveTo(W/2,H/2-10);oc.lineTo(W/2,H/2-3);oc.moveTo(W/2,H/2+3);oc.lineTo(W/2,H/2+10);oc.stroke();
 if(hm>0){hm-=.016;oc.strokeStyle='#fff';oc.lineWidth=2.5;oc.beginPath();for(const [a,b] of [[-1,-1],[1,-1],[-1,1],[1,1]]){oc.moveTo(W/2+a*6,H/2+b*6);oc.lineTo(W/2+a*14,H/2+b*14)}oc.stroke()}
 if(espL||espB||espH){oc.textAlign='center';oc.font='bold 11px Verdana';
  for(const b of bots){const a=V3(b.x,2.15,b.z).project(cam),f=V3(b.x,0,b.z).project(cam);if(a.z>1||f.z>1)continue;
   const ax=(a.x*.5+.5)*W,ay=(-a.y*.5+.5)*H,fx=(f.x*.5+.5)*W,fy=(-f.y*.5+.5)*H,h=fy-ay,w=h*.5;
   if(espB){oc.strokeStyle='#ff2d2d';oc.lineWidth=2;oc.strokeRect(fx-w/2,ay,w,h)}
   if(espH){const bw=Math.max(w,30);oc.fillStyle='#000a';oc.fillRect(fx-bw/2,ay-9,bw,6);oc.fillStyle=b.hp>25?'#46c26b':'#ff2d2d';oc.fillRect(fx-bw/2,ay-9,bw*Math.max(0,b.hp)/(b.mx||50),6);oc.fillStyle='#fff';oc.fillText(Math.max(0,Math.round(b.hp)),fx,ay-13)}
   if(espB){oc.fillStyle='#fff';oc.fillText(Math.round(Math.hypot(b.x-P.x,b.z-P.z))+'m',fx,fy+13)}
   if(espL){oc.strokeStyle='#ff2d2dcc';oc.lineWidth=1.5;oc.beginPath();oc.moveTo(W/2,0);oc.lineTo(ax,ay);oc.stroke()}}}
 if(aimbot&&fovShow){oc.strokeStyle='#ff2d2d';oc.lineWidth=2;oc.beginPath();oc.arc(W/2,H/2,fovR,0,7);oc.stroke()}
 if(ms){const [dx,dy]=sv(ms);oc.strokeStyle='#ffffff66';oc.lineWidth=2;oc.beginPath();oc.arc(ms.ox,ms.oy,55,0,7);oc.stroke();
  oc.fillStyle='#ffffff55';oc.beginPath();oc.arc(ms.ox+dx*55,ms.oy+dy*55,22,0,7);oc.fill()}}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;adapt(dt);for(const c of clouds){c.position.x+=dt*1.2;if(c.position.x>170)c.position.x=-170}if(!paused&&!over)upd(dt);if(over&&P.mesh.rotation.x<1.5)P.mesh.rotation.x+=dt*4;setCam(dt);R.render(scene,cam);hud();requestAnimationFrame(loop)}
reset();
requestAnimationFrame(loop);
</script>
