<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Arena Shooter 3D</title>
<style>
:root{--bg:#10140f;--fg:#e9eddc;--ac:#e8a317;--bad:#e5484d;--ok:#46c26b;--pn:#1a2018;--ln:#33402e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#10140f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Verdana,Tahoma,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#o{pointer-events:none}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:10px 12px;display:flex;gap:10px;align-items:center;pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000}
#hpw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 68px);width:min(44vw,260px);height:14px;background:#0007;border:1px solid var(--ln);border-radius:7px;overflow:hidden}
#hp{height:100%;width:100%;background:var(--ok);transition:width .15s}
#info{margin-left:auto;text-align:right}
#hf{position:fixed;inset:0;background:var(--bad);opacity:0;pointer-events:none;transition:opacity .25s}
.b{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--pn);color:var(--fg);border:1px solid var(--ln);font:inherit}
#wb{left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:20px;font-size:14px}
#fb{right:22px;width:84px;height:84px;border-radius:50%;background:#e5484dcc;border:2px solid #fff6;font-weight:bold;font-size:15px}
#fb:active{background:#ff6b6b}
#jb{right:120px;width:64px;height:64px;border-radius:50%;font-size:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:5}
.ov.on{display:flex}
.box{width:min(86vw,320px);background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px;max-height:calc(100vh - 16px);overflow-y:auto;touch-action:pan-y}
.box h2{margin:0 0 12px;font-size:18px}
.box input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--fg);font-size:16px;user-select:text;-webkit-user-select:text}
.box button{width:100%;margin-top:10px;padding:12px;border-radius:8px;border:0;background:var(--ac);color:#1a1300;font-weight:bold;font-size:15px}
.box button.g{background:transparent;color:var(--fg);border:1px solid var(--ln)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--ln)}
.box input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--ac);height:28px}
.sw{width:46px!important;height:26px;border-radius:13px!important;background:#444b40!important;position:relative;border:0;padding:0!important;margin:0!important}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)!important}.sw.on::after{left:23px}
#err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
#rot{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}
@media (orientation:portrait){#rot{display:flex}}
@media (max-height:480px){.ov{align-items:flex-start;padding-top:8px}}
</style>
</head>
<body>
<canvas id="o"></canvas>
<div id="rot">Gire o celular para a horizontal para jogar.<br>Toque aqui para tela cheia.</div>
<div id="hf"></div>
<div id="hud"><div id="hpw"><div id="hp"></div></div><div id="info"></div></div>
<button class="b" id="wb">Pistola</button>
<button class="b" id="fb">FOGO</button>
<button class="b" id="jb">PULAR</button>

<div class="ov" id="lock"><div class="box"><h2>Acesso restrito</h2>
<input id="pw" type="password" placeholder="Senha" autocomplete="off">
<div id="err"></div>
<button id="ent">Entrar</button><button class="g" id="cl1">Fechar</button></div></div>

<div class="ov" id="panel"><div class="box"><h2>Painel</h2>
<div class="row"><span>AIM BOT</span><button class="sw" id="sAim"></button></div>
<div id="aimOpt" style="display:none">
<div class="row"><span>Mostrar FOV</span><button class="sw" id="sFov"></button></div>
<div class="row" style="border:0;padding-bottom:0"><span>Tamanho do FOV</span><span id="fovV">150</span></div>
<input type="range" id="fovS" min="40" max="400" value="150">
</div>
<div class="row"><span>ESP linha</span><button class="sw" id="sEL"></button></div>
<div class="row"><span>ESP box</span><button class="sw" id="sEB"></button></div>
<div class="row"><span>ESP vida</span><button class="sw" id="sEH"></button></div>
<div class="row"><span>SPIN BOT</span><button class="sw" id="sSpin"></button></div>
<button id="cl2">Voltar ao jogo</button></div></div>

<div class="ov" id="go"><div class="box"><h2>Fim de jogo</h2><p id="gs"></p><button id="rs">Jogar de novo</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

let pt=[],shake=0;const PG=new THREE.BoxGeometry(.08,.08,.08),MC={};
function spark(p,c,n){for(let i=0;i<n;i++){const m=new THREE.Mesh(PG,MC[c]||(MC[c]=new THREE.MeshBasicMaterial({color:c})));m.position.copy(p);scene.add(m);pt.push({m,vx:(Math.random()-.5)*5,vy:Math.random()*5,vz:(Math.random()-.5)*5,t:.8})}}
function flash(p){P.mesh.userData.aim=.5;const m=new THREE.Mesh(new THREE.SphereGeometry(.18,6,4),new THREE.MeshBasicMaterial({color:0xfff0a0}));m.position.copy(p);scene.add(m);tr.push({l:m,t:.04})}
function tracer(a,b,c){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:c}));scene.add(l);tr.push({l,t:.07})}
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const Lv=()=>V3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
function setCam(){const L=Lv(),t=V3(P.x,1.7+P.y,P.z),r=V3(Math.cos(yaw),0,-Math.sin(yaw));
 cam.position.copy(t).addScaledVector(L,-5).addScaledVector(r,.8);cam.position.y=Math.max(.5,cam.position.y);if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake=Math.max(0,shake-.02)}
 cam.lookAt(cam.position.clone().add(L));sun.position.set(Math.round(P.x)+35,60,Math.round(P.z)+25);sun.target.position.set(Math.round(P.x),0,Math.round(P.z))}

function shoot(){const w=WEAP[wi],eye=V3(P.x,1.6+P.y,P.z),L=Lv(),muz=V3(P.x,1.3+P.y,P.z).addScaledVector(L,.8);
 const tg=[...bots.map(b=>b.mesh),...wm];
 for(let i=0;i<w.p;i++){let o,d;
  if(aimT){o=eye;d=V3(aimT.x,1.7,aimT.z).sub(eye).normalize()}else{o=cam.position.clone();d=L.clone()}
  d.x+=(Math.random()-.5)*w.sp*2;d.y+=(Math.random()-.5)*w.sp*2;d.z+=(Math.random()-.5)*w.sp*2;d.normalize();
  rc.set(o,d);rc.far=150;const h=rc.intersectObjects(tg,true);let end=o.clone().addScaledVector(d,100);
  if(h.length){end=h[0].point;const b=h[0].object.userData.bot;if(b){b.hp-=w.d*(h[0].object.userData.head?2:1);b.kx=(b.kx||0)+d.x*w.d*.25;b.kz=(b.kz||0)+d.z*w.d*.25;spark(end,0xc02020,8)}else spark(end,0xffd25a,4)}
  tracer(muz,end,0xffd25a)}
 flash(muz);pitch=Math.min(.7,pitch+(w.p>1?.05:.012));yaw+=(Math.random()-.5)*.006}

function sep(){const a=[P,...bots];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){if(i===0&&P.y>1.2)continue;const dx=a[j].x-a[i].x,dz=a[j].z-a[i].z,d=Math.hypot(dx,dz);if(d<1&&d>.001){const k=(1-d)/2,ux=dx/d,uz=dz/d;mvE(a[i],-ux*k,-uz*k,.5);mvE(a[j],ux*k,uz*k,.5)}}}
function upd(dt){
 let mx=0,my=0;if(ms)[mx,my]=sv(ms);
 if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;
 if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
 const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
 const f=-my,s=Math.sin(yaw),c=Math.cos(yaw);
 const gk=P.y>.05?3:12;P.vx+=((-s*f+c*mx)*7-P.vx)*Math.min(1,gk*dt);P.vz+=((-c*f-s*mx)*7-P.vz)*Math.min(1,gk*dt);mvE(P,P.vx*dt,P.vz*dt,.5);

 // aim bot
 aimT=null;
 if(aimbot){let bd=1e9;const eye=V3(P.x,1.6+P.y,P.z);for(const b of bots){if(Math.hypot(b.x-P.x,b.z-P.z)>70)continue;const q=V3(b.x,1.7,b.z).project(cam);if(q.z>1)continue;const sd=Math.hypot(q.x*.5*W,q.y*.5*H);if(sd<=fovR&&sd<bd&&clear(eye,V3(b.x,1.7,b.z))){bd=sd;aimT=b}}
  if(aimT){const v=V3(aimT.x,1.7,aimT.z).sub(eye),l=v.length(),k=Math.min(1,dt*14);
   yaw+=wrap(Math.atan2(-v.x,-v.z)-yaw)*k;pitch+=(Math.asin(v.y/l)-pitch)*k}}
 const fl=gh(P.x,P.z,P.y);if((jump||keys.Space)&&P.y<=fl+.02)P.vy=8.5;jump=false;P.vy-=25*dt;P.y+=P.vy*dt;if(P.y<fl){P.y=fl;P.vy=0}
 sep();
 spA+=dt*14;P.mesh.position.set(P.x,P.y,P.z);P.mesh.rotation.y=spin?spA:yaw;
 const ps=Math.hypot(P.x-P.px,P.z-P.pz)/Math.max(dt,.001);P.px=P.x;P.pz=P.z;anim(P.mesh,P.y>.05?0:Math.min(1,ps/5)*(ps>.6?1:0),dt);

 cdT-=dt;if((firing||mouse.down&&locked()||keys.KeyF||aimT)&&cdT<=0){shoot();cdT=WEAP[wi].cd}

 const pe=V3(P.x,1.5+P.y,P.z);
 for(const b of bots){const dx=P.x-b.x,dz=P.z-b.z,d=Math.hypot(dx,dz),see=d<45&&clear(V3(b.x,1.7,b.z),pe);
  if(see){b.mesh.rotation.y=Math.atan2(-dx,-dz);if(d>14)mvE(b,dx/d*3.4*dt,dz/d*3.4*dt,.5);
   b.cd-=dt;if(b.cd<=0){b.cd=.8+Math.random()*.7;const hit=Math.random()<.3,e=pe.clone();if(!hit){e.x+=(Math.random()-.5)*4;e.y+=(Math.random()-.5)*2}
    b.mesh.userData.aim=.5;tracer(V3(b.x,1.3,b.z),e,0xff6b6b);if(hit){P.hp-=7;shake=.2;$('hf').style.opacity=.45;setTimeout(()=>$('hf').style.opacity=0,120)}}}
  else{b.t-=dt;if(b.t<=0||Math.hypot(b.tx-b.x,b.tz-b.z)<1){b.tx=Math.max(-HW+3,Math.min(HW-3,b.x+(Math.random()-.5)*30));b.tz=Math.max(-HW+3,Math.min(HW-3,b.z+(Math.random()-.5)*30));b.t=4}
   const ex=b.tx-b.x,ez=b.tz-b.z,l=Math.hypot(ex,ez)||1;b.mesh.rotation.y=Math.atan2(-ex,-ez);mvE(b,ex/l*2*dt,ez/l*2*dt,.5)}
  if(b.kx||b.kz){mvE(b,b.kx*dt,b.kz*dt,.5);const kk=Math.exp(-8*dt);b.kx*=kk;b.kz*=kk}const bs=Math.hypot(b.x-(b.px??b.x),b.z-(b.pz??b.z))/Math.max(dt,.001);anim(b.mesh,Math.min(1,bs/3)*(bs>.6?1:0),dt);b.px=b.x;b.pz=b.z;b.mesh.position.set(b.x,0,b.z)}
 const n=bots.length;bots=bots.filter(b=>{if(b.hp>0)return true;b.dt=0;spark(V3(b.x,1.2,b.z),0xc02020,14);dead.push(b);return false});kills+=n-bots.length;
 dead=dead.filter(b=>{b.dt+=dt;b.mesh.rotation.x=Math.min(1.5,b.dt*4);anim(b.mesh,0,dt);if(b.dt>1.6){scene.remove(b.mesh);return false}return true});
 if(!bots.length)next();
 pt=pt.filter(p=>{p.t-=dt;p.vy-=18*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;if(p.m.position.y<.05){p.m.position.y=.05;p.vy*=-.4;p.vx*=.6;p.vz*=.6}if(p.t<=0){scene.remove(p.m);return false}return true});
 tr=tr.filter(t=>{t.t-=dt;if(t.t<=0){scene.remove(t.l);t.l.geometry.dispose();return false}return true});
 if(P.hp<=0&&!over){over=true;$('gs').textContent='Abates: '+kills+' | Onda: '+wave;$('go').classList.add('on')}
 $('hp').style.width=Math.max(0,P.hp)+'%';$('hp').style.background=P.hp>40?'var(--ok)':'var(--bad)';
 $('info').textContent='Abates '+kills+'  Onda '+wave+'  Inimigos '+bots.length;
}

function hud(){oc.clearRect(0,0,W,H);
 oc.strokeStyle='#fff';oc.lineWidth=2;oc.beginPath();oc.moveTo(W/2-10,H/2);oc.lineTo(W/2-3,H/2);oc.moveTo(W/2+3,H/2);oc.lineTo(W/2+10,H/2);oc.moveTo(W/2,H/2-10);oc.lineTo(W/2,H/2-3);oc.moveTo(W/2,H/2+3);oc.lineTo(W/2,H/2+10);oc.stroke();
 if(espL||espB||espH){oc.textAlign='center';oc.font='bold 11px Verdana';
  for(const b of bots){const a=V3(b.x,2.15,b.z).project(cam),f=V3(b.x,0,b.z).project(cam);if(a.z>1||f.z>1)continue;
   const ax=(a.x*.5+.5)*W,ay=(-a.y*.5+.5)*H,fx=(f.x*.5+.5)*W,fy=(-f.y*.5+.5)*H,h=fy-ay,w=h*.5;
   if(espB){oc.strokeStyle='#ff2d2d';oc.lineWidth=2;oc.strokeRect(fx-w/2,ay,w,h)}
   if(espH){const bw=Math.max(w,30);oc.fillStyle='#000a';oc.fillRect(fx-bw/2,ay-9,bw,6);oc.fillStyle=b.hp>25?'#46c26b':'#ff2d2d';oc.fillRect(fx-bw/2,ay-9,bw*Math.max(0,b.hp)/60,6);oc.fillStyle='#fff';oc.fillText(Math.max(0,Math.round(b.hp)),fx,ay-13)}
   if(espB){oc.fillStyle='#fff';oc.fillText(Math.round(Math.hypot(b.x-P.x,b.z-P.z))+'m',fx,fy+13)}
   if(espL){oc.strokeStyle='#ff2d2dcc';oc.lineWidth=1.5;oc.beginPath();oc.moveTo(W/2,0);oc.lineTo(ax,ay);oc.stroke()}}}
 if(aimbot&&fovShow){oc.strokeStyle='#ff2d2d';oc.lineWidth=2;oc.beginPath();oc.arc(W/2,H/2,fovR,0,7);oc.stroke()}
 if(ms){const [dx,dy]=sv(ms);oc.strokeStyle='#ffffff66';oc.lineWidth=2;oc.beginPath();oc.arc(ms.ox,ms.oy,55,0,7);oc.stroke();
  oc.fillStyle='#ffffff55';oc.beginPath();oc.arc(ms.ox+dx*55,ms.oy+dy*55,22,0,7);oc.fill()}}

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;adapt(dt);if(!paused&&!over)upd(dt);if(over&&P.mesh.rotation.x<1.5)P.mesh.rotation.x+=dt*4;setCam();R.render(scene,cam);hud();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
